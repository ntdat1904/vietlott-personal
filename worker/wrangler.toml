name = "power655-community-picks"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hourly purge of tickets older than the 24h window.
[triggers]
crons = ["0 * * * *"]

[vars]
# Comma-separated origins allowed to call the API (CORS). Add your GitHub Pages origin.
ALLOWED_ORIGINS = "https://ntdat1904.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"

# IP_SALT is a secret: `npx wrangler secret put IP_SALT` (local dev reads worker/.dev.vars).

[[d1_databases]]
binding = "DB"
database_name = "community-picks"
database_id = "b05d4152-29f6-4e7e-be8f-ea6390876c3a"
migrations_dir = "migrations"
